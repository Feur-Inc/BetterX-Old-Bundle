<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      padding: 20px;
      font-family: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e2e;
      color: #e0e0f0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 28px;
      height: 28px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version {
      font-size: 11px;
      font-weight: 400;
      color: #9090b0;
    }

    .divider {
      height: 1px;
      background: #3a3a52;
      margin-bottom: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #2a2a3e;
      border: 1px solid #3a3a52;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #9090b0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a3a52;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #22c55e;
    }

    .status-text {
      flex: 1;
    }

    .hint {
      font-size: 12px;
      color: #9090b0;
      line-height: 1.5;
      margin-bottom: 16px;
      padding: 0 2px;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #1d9bf0;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }
    .open-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 200 200" fill="currentColor">
      <path d="M136.6551,95.4922l3.4292-1.7013c18.0529-8.4865,18.7141-38.0995,4.8879-50.394-9.7757-8.6925-27.7556-10.5765-40.3856-11.0118-19.4186-.6679-39.2259.5283-58.6811.0133v135.4084l65.772.0166c20.3324-.8706,42.994-6.4729,47.5031-29.4203,3.6053-18.3686-3.3627-37.621-22.5254-42.911ZM123.5365,45.5169c6.3399.9005,13.6767,3.9774,17.0826,9.6761,3.283,5.496,3.8179,14.7965,1.8674,20.7942-2.6716,8.2074-11.0916,11.2411-18.9501,12.4207v-42.891ZM73.2024,156.8182h-16.3051V43.3903h16.3051v113.4279ZM112.9035,156.466l-29.0681.3522v-55.6507l29.0681.3555v54.9429ZM112.9035,89.8234l-29.0681.3555v-46.7887l29.0681.3522v46.0809ZM123.5365,154.3394v-50.6897c15.1255,2.861,24.5058,10.0814,25.5126,22.4922,1.2029,14.8165-6.649,24.7285-25.5126,28.1975Z"/>
    </svg>
    <div class="title">
      BetterX
      <span class="version">v3.0</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="status">
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">Checking...</span>
  </div>

  <p class="hint">Open X.com and click the BetterX button in the sidebar to access settings.</p>

  <button class="open-btn" id="open-tab">Open X.com</button>

  <script type="module" src="./index.ts"></script>
</body>
</html>
