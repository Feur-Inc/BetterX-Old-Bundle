<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #e0e0f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px;
      height: 32px;
      color: #1d9bf0;
    }
    h1 { font-size: 18px; font-weight: 700; }
    .version { font-size: 11px; color: #9090b0; margin-left: 4px; }
    p { font-size: 13px; color: #9090b0; line-height: 1.5; }
    .open-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: #1d9bf0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .open-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
      <path d="M8 12h8M12 8v8" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>BetterX <span class="version">v2.0</span></h1>
  </div>
  <p>Navigate to X.com and click the BetterX button in the sidebar to open settings.</p>
  <button class="open-btn" id="open-tab">Open X.com</button>
  <script type="module" src="./index.ts"></script>
</body>
</html>
